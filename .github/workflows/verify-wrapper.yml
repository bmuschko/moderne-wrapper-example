name: Verify Moderne CLI Wrapper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wrapper (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x modw configure-mod.sh
          ./modw --version

      - name: Install wrapper (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: modw.cmd --version

      - name: Configure CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./configure-mod.sh init

      - name: Configure CLI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: configure-mod.cmd init

      - name: Verify mod is on PATH
        run: mod version
