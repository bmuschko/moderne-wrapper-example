name: Verify Moderne CLI Wrapper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./init-mod
          echo "$HOME/.moderne/cli/bin" >> "$GITHUB_PATH"

      - name: Initialize CLI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call init-mod.cmd
          echo %USERPROFILE%\.moderne\cli\bin>> "%GITHUB_PATH%"

      - name: Verify mod is on PATH
        run: mod --version
