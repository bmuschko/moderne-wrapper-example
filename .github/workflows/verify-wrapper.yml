name: Verify Moderne CLI Wrapper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x modw configure-mod.sh
          ./configure-mod.sh init

      - name: Install and configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: configure-mod.cmd init

      - name: Verify mod CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./modw --version

      - name: Verify mod CLI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: modw.cmd --version
