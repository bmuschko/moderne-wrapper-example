name: Verify Moderne CLI Wrapper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wrapper (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./modw
          echo "$HOME/.moderne/cli/bin" >> "$GITHUB_PATH"

      - name: Install wrapper (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          modw.cmd
          for /f "delims=" %%d in ('dir /s /b "%USERPROFILE%\.moderne\cli\dist\*mod.exe" 2^>nul') do echo %%~dpd>> "%GITHUB_PATH%"

      - name: Configure CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./configure-mod.sh init

      - name: Configure CLI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: configure-mod.cmd init

      - name: Verify mod is on PATH
        run: mod --version
